<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cámaras - Sin Límite</title>
    <style>
        :root {
            --bg-color: #121212;
            --header-bg: #0a0a0a;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #00a8ff;
            --accent-hover: #007bb5;
            --danger: #ff4757;
            --danger-hover: #ff6b81;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        main {
            padding: 1.5rem;
            flex-grow: 1;
        }

        /* Cuadrícula fluida: se adapta automáticamente al número de cámaras y tamaño de pantalla */
        #camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .camera-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .feed-container {
            position: relative;
            background-color: #000;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2a2a2a;
        }

        /* Simulación de ruido/estática para el feed vacío */
        .feed-placeholder {
            color: #333;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            user-select: none;
        }

        .overlay-rec {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ff4757;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ff4757;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .overlay-timestamp {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-family: monospace;
            font-size: 0.9rem;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 3px 6px;
            border-radius: 4px;
        }

        .controls {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
        }

        .cam-name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
            width: 60%;
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s;
            padding-bottom: 2px;
        }

        .cam-name-input:focus, .cam-name-input:hover {
            border-bottom-color: var(--accent);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <header>
        <h1>🟢 Yi Home Replica</h1>
        <button class="btn" onclick="addCamera()">+ Añadir Cámara</button>
    </header>

    <main>
        <div id="camera-grid">
            <!-- Las cámaras se insertarán aquí dinámicamente -->
        </div>
    </main>

    <script>
        const grid = document.getElementById('camera-grid');
        let cameras = [];
        let cameraCounter = 1;

        // Inicializar con 2 cámaras por defecto
                window.onload = () => {
            // Define aquí tus cámaras reales
            cameras = [
                { id: 'cam1', name: 'Pista de Hielo - General' },
                { id: 'cam2', name: 'Taquilla' },
                { id: 'cam3', name: 'Entrega de Patines' },
                { id: 'cam4', name: 'Exterior' }
            ];
            cameraCounter = 5; // El siguiente número después de tus cámaras
            
            renderGrid();
            setInterval(updateAllTimestamps, 1000);
        };


        function addCamera() {
            const newCam = {
                id: Date.now() + Math.random().toString(16).slice(2),
                name: `Cámara ${cameraCounter}`
            };
            cameraCounter++;
            cameras.push(newCam);
            renderGrid();
        }

        function removeCamera(id) {
            cameras = cameras.filter(cam => cam.id !== id);
            renderGrid();
        }

        function updateCameraName(id, newName) {
            const camIndex = cameras.findIndex(cam => cam.id === id);
            if (camIndex !== -1) {
                cameras[camIndex].name = newName;
            }
        }

        function renderGrid() {
            grid.innerHTML = '';

            if (cameras.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No hay cámaras conectadas</h2>
                        <p>Haz clic en "+ Añadir Cámara" para empezar.</p>
                    </div>
                `;
                return;
            }

            cameras.forEach(cam => {
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <div class="feed-container">
                        <div class="overlay-rec">
                            <div class="dot"></div> REC
                        </div>
                        <div class="feed-placeholder">NO SIGNAL</div>
                        <div class="overlay-timestamp" id="ts-${cam.id}">
                            ${getFormattedDate()}
                        </div>
                    </div>
                    <div class="controls">
                        <input type="text" 
                               class="cam-name-input" 
                               value="${cam.name}" 
                               onchange="updateCameraName('${cam.id}', this.value)"
                               title="Haz clic para renombrar">
                        <button class="btn btn-danger" onclick="removeCamera('${cam.id}')">Eliminar</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getFormattedDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        function updateAllTimestamps() {
            const currentTime = getFormattedDate();
            cameras.forEach(cam => {
                const timestampEl = document.getElementById(`ts-${cam.id}`);
                if (timestampEl) {
                    timestampEl.textContent = currentTime;
                }
            });
        }
    </script>
</body>
</html>
